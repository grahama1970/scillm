name: Local Smokes (Proxy)

on:
  workflow_dispatch: {}

jobs:
  smokes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight proxy availability
        id: ping
        run: |
          set +e
          curl -fsS http://127.0.0.1:4010/metrics >/dev/null 2>&1
          echo "available=$?" >> $GITHUB_OUTPUT

      - name: Skip if proxy not available
        if: steps.ping.outputs.available != '0'
        run: |
          echo "Proxy not reachable on 127.0.0.1:4010; skipping smokes."
          exit 0

      - name: Run chat headers smoke
        run: python3 scripts/smoke_chat_headers.py

      - name: Run budget endpoint smoke
        run: python3 scripts/smoke_budget_endpoint.py

      - name: Run demo pricing smoke (best-effort)
        run: |
          python3 scripts/smoke_demo_pricing.py || true

