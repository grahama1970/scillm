name: Units Collaboration

on:
  push:
    paths:
      - 'src/lean4_prover/bridge/**'
      - 'src/common/**'
      - 'tests/local_testing/test_lean4_bridge_units_*'
      - 'tests/local_testing/test_units_normalize_preview.py'
      - 'docs/UNITS_COLLABORATION.md'
      - '.github/workflows/units-collaboration.yml'
  pull_request:
    paths:
      - 'src/lean4_prover/bridge/**'
      - 'src/common/**'
      - 'tests/local_testing/test_lean4_bridge_units_*'
      - 'tests/local_testing/test_units_normalize_preview.py'
      - 'docs/UNITS_COLLABORATION.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install minimal deps for tests
          pip install pint fastapi httpx pytest
      - name: Run tests (units collaboration)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest -q tests/local_testing/test_lean4_bridge_units_422.py \
                     tests/local_testing/test_lean4_bridge_units_confirm.py \
                     tests/local_testing/test_units_normalize_preview.py
