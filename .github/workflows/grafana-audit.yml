name: Grafana Audit (Optional)

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GRAFANA_URL: ${{ vars.GRAFANA_URL || 'http://127.0.0.1:3000' }}
      METRICS_ENV: dev
      GRAFANA_AUDIT_WINDOW: 15m
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight Grafana availability
        id: ping
        run: |
          set +e
          curl -fsS "$GRAFANA_URL/api/health" >/dev/null 2>&1
          echo "available=$?" >> $GITHUB_OUTPUT

      - name: Skip if Grafana not available
        if: steps.ping.outputs.available != '0'
        run: |
          echo "Grafana not reachable at $GRAFANA_URL; skipping audit."
          exit 0

      - name: Install deps
        run: pip install httpx

      - name: Run audit
        run: |
          mkdir -p artifacts
          python3 scripts/grafana_audit.py > artifacts/grafana_audit.json || true

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: grafana-audit
          path: artifacts/grafana_audit.json

