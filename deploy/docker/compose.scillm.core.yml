services:
  # utls TLS proxy: Chrome fingerprint for Cloudflare-protected endpoints (Codex)
  utls-proxy:
    build:
      context: ../utls-proxy
      dockerfile: Dockerfile
    environment:
      UPSTREAM: "https://chatgpt.com"
      LISTEN: ":8444"
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8444/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  scillm-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.scillm
    # Repo .env is authoritative for keys on EVERY deploy. Do NOT re-add
    # SCILLM_MASTER_KEY/LITELLM_MASTER_KEY to the environment block below:
    # `environment:` overrides env_file, and its ${VAR:-default} substitution
    # reads the COMPOSE SHELL env (not this env_file), so any `docker compose
    # up` without --env-file silently reverted the key to the dev default
    # (issue #31).
    env_file: ["../../.env"]
    environment:
      PYTHONPATH: /app/src
      CONFIG_FILE_PATH: /app/config.yaml
      # network_mode is host, so the host loopback IS the container loopback;
      # keep the docker Ollama rewrite pointed at loopback instead of the
      # bridged-compose "ollama" DNS name.
      SCILLM_DOCKER_OLLAMA_BASE: ${SCILLM_DOCKER_OLLAMA_BASE:-http://127.0.0.1:11434}
      METRICS_ENV: ${METRICS_ENV:-dev}
      # Bifrost removed — direct provider routing, ArangoDB for logging/monitoring
    restart: unless-stopped
    network_mode: host
    depends_on:
      utls-proxy:
        condition: service_healthy
    volumes:
      # Keep deploy-time config on the durable checkout, not the invoking
      # worktree (which may live under /tmp and disappear before a restart).
      - "${SCILLM_REPO_ROOT:-/home/graham/workspace/experiments/scillm}/local/proxy_server_config.yaml:/app/config.yaml:ro"
      # Credential CLIs rotate files with atomic rename. Mount their parent
      # directories read-write so the container follows the replacement inode
      # and scillm can write refreshed tokens back to the host.
      - "${HOME}/.pi/agent:/root/.pi/agent"
      - "${HOME}/.claude:/root/.claude"
      - "${HOME}/.codex:/root/.codex"
      # Gemini CLI needs write access for history/sessions
      - "${HOME}/.gemini:/root/.gemini"
      # OpenCode Go model discovery needs the connected provider auth/config.
      # Cache is writable so `opencode models --refresh opencode-go` can update.
      - "${HOME}/.local/share/opencode:/root/.local/share/opencode"
      - "${HOME}/.config/opencode:/root/.config/opencode:ro"
      - "${HOME}/.cache/opencode:/root/.cache/opencode"
      # The proxy validates OpenCode-serve cwd before handing a request to the
      # opencode-serve container. Mount the same primary checkout root here so
      # host paths such as /home/graham/workspace/experiments/agent-skills are
      # visible to the validation layer instead of failing before provider launch.
      - "${HOME}/workspace:/home/graham/workspace:ro"
      # JSONL backup — independent of DB, survives wipes, append-only
      - "/mnt/storage12tb/scillm-logs:/mnt/storage12tb/scillm-logs"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "Authorization: Bearer $${SCILLM_MASTER_KEY}", "http://127.0.0.1:4001/health/liveliness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  opencode-serve:
    build:
      # experiments/ context: includes opencode fork + scillm deploy scripts
      context: ../../..
      dockerfile: scillm/deploy/docker/Dockerfile.opencode-serve
      args:
        OPENCODE_GIT_REF: ${OPENCODE_GIT_REF:-dev}
    user: "${OPENCODE_SERVE_USER:-graham:graham}"
    env_file: ["../../.env"]
    environment:
      HOME: /home/graham
      OPENCODE_SERVE_PORT: ${OPENCODE_SERVE_PORT:-4098}
      OPENCODE_SERVE_HOSTNAME: ${OPENCODE_SERVE_HOSTNAME:-0.0.0.0}
      OPENCODE_SERVE_WORKDIR: /workspace/opencode-serve
      OPENCODE_SERVE_PURE: ${OPENCODE_SERVE_PURE:-0}
      OPENCODE_SERVE_HEALTH_MAX_CPU: ${OPENCODE_SERVE_HEALTH_MAX_CPU:-120}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENCODE_SERVE_PORT:-4098}:${OPENCODE_SERVE_PORT:-4098}"
      # Codex ChatGPT OAuth browser callback.
      - "127.0.0.1:1455:1455"
    volumes:
      # Directory mount, not single-file: auth.json is rotated by atomic rename
      # and a missing file at container start becomes a root-owned dir (issue #22 class).
      - "${HOME}/.local/share/opencode:/home/graham/.local/share/opencode"
      - "${HOME}/.config/opencode:/home/graham/.config/opencode:rw"
      - "${HOME}/.cache/opencode:/home/graham/.cache/opencode"
      - "${HOME}/.claude/skills:/home/graham/.claude/skills:ro"
      - "${HOME}/.codex/skills:/home/graham/.codex/skills:ro"
      - "${HOME}/workspace:/home/graham/workspace"
      - "${SCILLM_EXTRA_WORKSPACE_PATH:-/tmp/agent-skills-loop2-main}:${SCILLM_EXTRA_WORKSPACE_PATH:-/tmp/agent-skills-loop2-main}:rw"
      # Transport DAG workers may receive source/artifact paths on the 12TB data volume.
      - "/mnt/storage12tb:/mnt/storage12tb"
      - "../../:/workspace/scillm"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/usr/local/bin/opencode-serve-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
