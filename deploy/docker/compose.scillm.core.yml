services:
  # utls TLS proxy: Chrome fingerprint for Cloudflare-protected endpoints (Codex)
  utls-proxy:
    build:
      context: ../utls-proxy
      dockerfile: Dockerfile
    environment:
      UPSTREAM: "https://chatgpt.com"
      LISTEN: ":8444"
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8444/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  scillm-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.scillm
    env_file: ["../../.env"]
    environment:
      PYTHONPATH: /app/src
      CONFIG_FILE_PATH: /app/config.yaml
      SCILLM_MASTER_KEY: ${SCILLM_MASTER_KEY:-sk-dev-proxy-123}
      METRICS_ENV: ${METRICS_ENV:-dev}
      REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
      REDIS_PORT: ${REDIS_PORT:-6379}
      BIFROST_ENABLED: ${BIFROST_ENABLED:-false}
      BIFROST_URL: ${BIFROST_URL:-http://127.0.0.1:4002}
      BIFROST_CLIENT_KEY: ${BIFROST_CLIENT_KEY:-}
    restart: unless-stopped
    network_mode: host
    depends_on:
      utls-proxy:
        condition: service_healthy
    volumes:
      - "../../local/proxy_server_config.yaml:/app/config.yaml:ro"
      - "${HOME}/.pi/agent/auth.json:/root/.pi/agent/auth.json:ro"
      - "${HOME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro"
      - "${HOME}/.codex/auth.json:/root/.codex/auth.json:ro"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "Authorization: Bearer $${SCILLM_MASTER_KEY:-sk-dev-proxy-123}", "http://127.0.0.1:4001/health/liveliness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
