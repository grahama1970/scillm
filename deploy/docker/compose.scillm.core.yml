services:
  # utls TLS proxy: Chrome fingerprint for Cloudflare-protected endpoints (Codex)
  utls-proxy:
    build:
      context: ../utls-proxy
      dockerfile: Dockerfile
    environment:
      UPSTREAM: "https://chatgpt.com"
      LISTEN: ":8444"
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8444/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  scillm-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.scillm
    env_file: ["../../.env"]
    environment:
      PYTHONPATH: /app/src
      CONFIG_FILE_PATH: /app/config.yaml
      SCILLM_MASTER_KEY: ${SCILLM_MASTER_KEY:-${LITELLM_MASTER_KEY:-sk-dev-proxy-123}}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-${SCILLM_MASTER_KEY:-sk-dev-proxy-123}}
      METRICS_ENV: ${METRICS_ENV:-dev}
      # Bifrost removed — direct provider routing, ArangoDB for logging/monitoring
    restart: unless-stopped
    network_mode: host
    depends_on:
      utls-proxy:
        condition: service_healthy
    volumes:
      - "../../local/proxy_server_config.yaml:/app/config.yaml:ro"
      - "${HOME}/.pi/agent/auth.json:/root/.pi/agent/auth.json:ro"
      - "${HOME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro"
      - "${HOME}/.codex/auth.json:/root/.codex/auth.json:ro"
      # Gemini CLI needs write access for history/sessions
      - "${HOME}/.gemini:/root/.gemini"
      # OpenCode Go model discovery needs the connected provider auth/config.
      # Cache is writable so `opencode models --refresh opencode-go` can update.
      - "${HOME}/.local/share/opencode/auth.json:/root/.local/share/opencode/auth.json:ro"
      - "${HOME}/.config/opencode:/root/.config/opencode:ro"
      - "${HOME}/.cache/opencode:/root/.cache/opencode"
      # JSONL backup — independent of DB, survives wipes, append-only
      - "/mnt/storage12tb/scillm-logs:/mnt/storage12tb/scillm-logs"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "Authorization: Bearer $${SCILLM_MASTER_KEY:-sk-dev-proxy-123}", "http://127.0.0.1:4001/health/liveliness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
