services:
  codeworld-bridge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.scillm
    command: ["sh","-lc","PYTHONPATH=src uvicorn codeworld.bridge.server:app --host 0.0.0.0 --port 8887"]
    environment:
      - CODEWORLD_BASE=http://0.0.0.1:8887
    ports:
      - "8887:8887"

  # lean4-bridge: REMOVED - use direct mode via scillm.integrations.certainly
  # If HTTP fallback needed, use the bridge server from the lean4 repo directly

