services:
  arangodb:
    image: arangodb:3.11
    environment:
      - ARANGO_ROOT_PASSWORD=root
    # Internal only to avoid host port conflicts
    # ports:
    #   - "8529:8529"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8529/_api/version"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-inference
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_ORIGINS: ${OLLAMA_ORIGINS:-*}
    volumes:
      - "${HOME}/.ollama:/root/.ollama"
      - "/mnt/storage12tb:/mnt/storage12tb:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  codeworld-bridge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.scillm
    command: ["sh","-lc","PYTHONPATH=/app/src uvicorn codeworld.bridge.server:app --host 0.0.0.0 --port 8887"]
    environment:
      - CODEWORLD_BASE=http://0.0.0.0:8887
      - CODEWORLD_SCORING_NONET=1
      - CODEWORLD_STRATEGY_NONET=1
      - CODEWORLD_REDIS_URL=redis://redis:6379/0
    ports:
      - "8887:8887"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8887/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # lean4-bridge: REMOVED - use direct mode via scillm.integrations.certainly
  # If HTTP fallback needed, run the bridge server from the lean4 repo directly

  scillm-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.scillm
    command: ["uvicorn", "scillm.proxy.app:app", "--host", "0.0.0.0", "--port", "4001"]
    env_file: ["../../.env"]
    environment:
      PYTHONPATH: /app/src
      CONFIG_FILE_PATH: /app/config.yaml
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env; do not use the development default}
      METRICS_ENV: ${METRICS_ENV:-dev}
      # Redis removed from scillm — all logging via ArangoDB
      # Redis service kept for codeworld-bridge only
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - "../../local/proxy_server_config.yaml:/app/config.yaml:ro"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "Authorization: Bearer $${LITELLM_MASTER_KEY}", "http://127.0.0.1:4001/health/liveliness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
