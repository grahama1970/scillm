[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:bifrost]
command=bifrost -app-dir /app/bifrost/data -host 0.0.0.0 -port 4002 -log-level info -log-style pretty
autostart=true
autorestart=true
startretries=3
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scillm]
command=uvicorn scillm.proxy.app:app --host 0.0.0.0 --port 4001
environment=PYTHONPATH="/app/src",CONFIG_FILE_PATH="/app/config.yaml"
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
