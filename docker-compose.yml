# scillm proxy + Redis — the minimal production stack.
#
# Usage:
#   docker compose up -d --build                        # proxy + Redis
#   docker compose --profile local up -d --build        # + Ollama (local models)
#
# Proxy: http://127.0.0.1:4001  (Bearer sk-dev-proxy-123)
# Redis: localhost:6379 (caching + request logging)
# Ollama: localhost:11434 (optional, for local-text model group)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  scillm-proxy:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.scillm
    command: ["uvicorn", "scillm.proxy.app:app", "--host", "0.0.0.0", "--port", "4001"]
    env_file: [".env"]
    environment:
      PYTHONPATH: /app/src
      CONFIG_FILE_PATH: /app/config.yaml
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-proxy-123}
      METRICS_ENV: ${METRICS_ENV:-dev}
      REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
      REDIS_PORT: ${REDIS_PORT:-6379}
    restart: unless-stopped
    network_mode: host
    volumes:
      - "./local/proxy_server_config.yaml:/app/config.yaml:ro"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "Authorization: Bearer $${LITELLM_MASTER_KEY:-sk-dev-proxy-123}", "http://127.0.0.1:4001/health/liveliness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_models: {}
