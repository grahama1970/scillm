services:
  certainly_bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bridge
    image: certainly/lean4-bridge:local
    ports:
      - "8791:8787"
    environment:
      - CERTAINLY_ARTIFACTS_DIR=/app/local/artifacts/runs
      - LEAN4_REPO=/lean4
      # Pass-through LLM and defaults from host to container
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CERTAINLY_MODEL=${CERTAINLY_MODEL:-}
      - CERTAINLY_LLM_DEFAULT=${CERTAINLY_LLM_DEFAULT:-}
      - CERTAINLY_MAX_SECONDS=${CERTAINLY_MAX_SECONDS:-600}
      - SCILLM_DEFAULT_MODEL=${SCILLM_DEFAULT_MODEL:-ollama/qwen3:8b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      # Persist artifacts onto host (optional)
      - ../local/artifacts:/app/local/artifacts
      # Mount Lean4 repo read-only so bridge can call CLI
      # Host path can be overridden via CERTAINLY_REPO_HOST
      - ${CERTAINLY_REPO_HOST:-../../lean4}:/lean4:ro
      # Allow Lean4 CLI to manage the lean_runner container via Docker CLI
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - scillm_default
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  scillm_default:
    external: true
